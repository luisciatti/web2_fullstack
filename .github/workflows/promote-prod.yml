name: Promote image to prod

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Tag da imagem a ser promovida para prod
                required: true
                type: string

env:
    IMAGE: ghcr.io/${{ github.repository_owner }}/web2-backend
    TAG: ${{ inputs.tag }}

jobs:
    promote:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v3

            - name: Validar tag existente
              shell: bash
              run: |
                  docker buildx imagetools inspect "$IMAGE:$TAG"

            - name: Promover para prod
              shell: bash
              run: |
                  docker buildx imagetools create -t "$IMAGE:prod" "$IMAGE:$TAG"
