name: Build e push da imagem

# A tag prod é seguida pela VM a cada ~5 min; rollback manual é feito pelo workflow promote-prod.yml com uma tag sha-... antiga.
concurrency:
    group: build-push-${{ github.ref }}
    cancel-in-progress: false

on:
    push:
        branches: [main]
        paths:
            - "backend/**"
            - ".github/workflows/build-push.yml"
    pull_request:
        paths:
            - "backend/**"
            - ".github/workflows/build-push.yml"
    workflow_dispatch:

env:
    IMAGE: ghcr.io/${{ github.repository_owner }}/web2-backend

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven

            - name: Testes do backend
              working-directory: backend
              run: mvn -B -ntp test

    image:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-qemu-action@v3
              with:
                  platforms: arm64

            - uses: docker/setup-buildx-action@v3

            - name: Login no GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=sha,format=short
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=raw,value=prod,enable={{is_default_branch}}

            - uses: docker/build-push-action@v6
              with:
                  context: backend
                  platforms: linux/arm64
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
