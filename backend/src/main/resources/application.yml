server:
  port: 8080

spring:
  application:
    name: web2-fullstack-backend
  datasource:
    url: jdbc:h2:mem:web2db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /docs/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  metrics:
    tags:
      application: web2-backend
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

app:
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
  rate-limit:
    auth:
      max-requests: ${APP_RATE_LIMIT_AUTH_MAX_REQUESTS:20}
      window-seconds: ${APP_RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
  jwt:
    # Sem padrão: sem JWT_SECRET a aplicação não sobe (para dev local use o perfil dev)
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:300000}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
