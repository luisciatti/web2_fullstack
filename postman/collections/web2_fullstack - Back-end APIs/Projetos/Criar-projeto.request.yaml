$kind: http-request
name: Criar projeto
method: POST
url: '{{baseUrl}}/api/projetos'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Projeto Exemplo",
      "linguagem": "java",
      "framework": "spring-boot",
      "provedorCloud": "aws",
      "classes": [
        {
          "nome": "Usuario",
          "atributos": [
            {
              "nome": "nome",
              "tipo": "String"
            }
          ],
          "metodos": []
        }
      ],
      "servicosCloud": [
        {
          "id": "db-principal",
          "tipo": "aws-rds",
          "categoria": "DATA",
          "configuracao": {
            "engine": "postgres",
            "dbName": "projeto_exemplo",
            "username": "usuario_teste",
            "password": "senha_teste"
          }
        }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const response = pm.response.json();
      if (response.id) {
        pm.collectionVariables.set('id', response.id);
      }
